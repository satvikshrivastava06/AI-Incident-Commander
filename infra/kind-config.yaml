# kind cluster config. Without extraPortMappings, NodePorts exist only
# inside the kind node container, so the docker-compose Prometheus can
# never scrape the services (every app target shows DOWN). Each mapping
# publishes a NodePort on your machine's localhost so that
# host.docker.internal:<port> from a compose container reaches it.
# Must be passed at creation time -- cannot be added to an existing cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30000, hostPort: 30000, protocol: TCP }  # inventory-service
      - { containerPort: 30001, hostPort: 30001, protocol: TCP }  # auth-service
      - { containerPort: 30002, hostPort: 30002, protocol: TCP }  # payment-service
      - { containerPort: 30003, hostPort: 30003, protocol: TCP }  # recommendation-service
      - { containerPort: 30004, hostPort: 30004, protocol: TCP }  # notification-service
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }  # gateway
