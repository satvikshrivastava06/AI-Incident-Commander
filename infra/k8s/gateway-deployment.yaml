apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8001
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8002
            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8000
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation-service:8003
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  # NodePort, not ClusterIP -- the gateway is the system's single
  # externally-reachable entry point, mirroring the "API Gateway"
  # pattern from Milestone 1.C. Every other service stays ClusterIP
  # (internal-only), since nothing outside the cluster should ever
  # call auth-service or payment-service directly.
  type: NodePort
  ports:
    - port: 8005
      targetPort: 8005
      nodePort: 30080