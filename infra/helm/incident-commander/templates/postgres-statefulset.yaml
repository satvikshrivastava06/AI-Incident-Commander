apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/opaque-ports: "5432"
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incident-commander-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
{{- if .Values.meshPolicy.enabled }}
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata:
  name: postgres-server
spec:
  podSelector:
    matchLabels:
      app: postgres
  port: 5432
  proxyProtocol: opaque
---
# CHANGED: previously listed only payment-service's identity. Now
# that incident-engine and telemetry-consumer are REAL in-mesh
# deployments too (this response), they're legitimate Postgres
# clients and need to be authorized -- not just the one service that
# happened to be meshed first.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: postgres-clients-identity
spec:
  identities:
    - "payment-service.{{ .Values.meshPolicy.namespace }}.serviceaccount.identity.linkerd.cluster.local"
    - "incident-engine.{{ .Values.meshPolicy.namespace }}.serviceaccount.identity.linkerd.cluster.local"
    - "telemetry-consumer.{{ .Values.meshPolicy.namespace }}.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: postgres-authorized-clients-only
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: postgres-server
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: postgres-clients-identity
{{- end }}