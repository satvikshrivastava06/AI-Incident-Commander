apiVersion: v1
kind: Secret
metadata:
  name: incident-commander-secrets
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresSecrets.password | quote }}
  redis-password: {{ .Values.redisSecrets.password | quote }}
  api-key: {{ .Values.apiSecrets.apiKey | quote }}
  otel-auth-token: {{ .Values.otelSecrets.authToken | quote }}
  prometheus-password: {{ .Values.prometheusSecrets.password | quote }}