{{- if .Values.paymentServiceAutoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: {{ .Values.paymentServiceAutoscaling.minReplicas }}
  maxReplicas: {{ .Values.paymentServiceAutoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.paymentServiceAutoscaling.targetCPUUtilizationPercentage }}
{{- end }}